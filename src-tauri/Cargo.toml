[package]
name = "placemill"
version = "0.1.1"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
# Auto-update (G-06). The check/download/install requests run in Rust, so the
# update endpoint is not subject to the webview CSP. `pubkey` in tauri.conf.json
# is the minisign public half of the release signing key (see README).
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
csv = "1.3"
rust_xlsxwriter = "0.77"
# Local-time formatting of `collected_at` in the exports. Already in the lock
# as a transitive dependency; `clock` pulls the OS timezone lookup.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Blocking fetch of the remote field-map config (roadmap M5). One GET on a
# worker thread at startup; ureq keeps the dependency tree small.
ureq = { version = "2", default-features = false, features = ["tls"] }
# URL parsing/normalization for the site miner (M7): same-domain checks and
# relative-href resolution. Already in the tree via ureq.
url = "2"
# Email/social/contact-link extraction over scraped HTML (M7). Already in the
# tree as a transitive dependency.
regex = "1"
# DOM parsing for the same extraction (R-21b). html5ever builds the tree the
# browser would, so attribute order, quoting, nesting and a `</script>` inside
# a script string no longer change the result. ~18 transitive crates and about
# 1.5 MB of release binary; `regex` stays only as the fallback path.
scraper = "0.29.0"
# Signature check for the remote field-map config (R-32b). Pinned to the version
# `tauri-plugin-updater` already resolves, so the tree gains nothing new; the
# API used here (`PublicKey::decode`, `Signature::decode`, `verify`) is stable
# in 0.2 and was verified against 0.2.5.
minisign-verify = "0.2.5"
# Registrable-domain (eTLD+1) grouping for the email miner (P1-6). The
# hand-written two-label table grouped unrelated `.com.ru` sites and every
# `blogspot.com` blog together, then wrote one site's contacts to all of them.
# `psl` embeds the Public Suffix List (private section included) and does no
# runtime IO.
psl = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
