name: CI

# R-36: the repository had no CI at all — `cargo check` and the TypeScript pass
# only ever ran on the developer's machine, so a broken commit could sit on main
# until someone tried to build a release.
#
# Windows is the primary target (the app ships an NSIS installer and the e2e
# suites drive WebView2), and it is the only runner where `cargo check` needs no
# extra system packages.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # `tauri::generate_context!` reads dist/ at compile time, so the frontend
      # has to exist before cargo runs.
      - name: Type-check and bundle the frontend
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # `dead_code`, `unused_imports` and unused variables are warnings by
      # default, so a dead helper can sit on main forever: nobody reads the log
      # of a green build. `count_reviews` in db.rs was exactly that — it outlived
      # the feature that was supposed to call it and only a test still referenced
      # it. Warnings are errors here, so the compiler enforces what a code-review
      # convention can only recommend.
      # Cargo caps lints for non-workspace dependencies, so this stays about us.
      - name: Check the backend
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      # P2-8: this includes the query gate `queries_stay_responsive_at_20k_rows`
      # (20k rows, filter + sort + paginate, bound calibrated for debug builds).
      # The 300 ms / 100k release benchmark stays `#[ignore]` and is run on
      # demand: cargo test --release --lib queries_stay_under_300ms -- --ignored
      - name: Run backend tests
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test --manifest-path src-tauri/Cargo.toml
